  <!-- ======================================================= -->
  <!-- DEMO SCRIPT (only to preview collapse / drawer / dropdown -->
  <!-- behaviour here -- reimplement with your own JS/Inertia)  -->
  <!-- ======================================================= -->
  <script>
    lucide.createIcons();

    // Mobile drawer
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('mobileOverlay');
    document.getElementById('openMobileSidebar').addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    });
    document.getElementById('closeMobileSidebar').addEventListener('click', closeMobile);
    overlay.addEventListener('click', closeMobile);
    function closeMobile() {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    // Desktop collapse
    let collapsed = false;
    document.getElementById('collapseToggle').addEventListener('click', () => {
      collapsed = !collapsed;
      sidebar.classList.toggle('lg:w-[76px]', collapsed);
      sidebar.classList.toggle('lg:w-[268px]', !collapsed);
      document.querySelectorAll('.menu-label, .menu-chevron').forEach(el => el.classList.toggle('lg:hidden', collapsed));
      document.getElementById('brandText').classList.toggle('lg:hidden', collapsed);
      document.getElementById('collapseLabel').classList.toggle('hidden', collapsed);
      document.querySelectorAll('.menu-children').forEach(el => { if (collapsed) el.classList.add('lg:hidden'); else el.classList.remove('lg:hidden'); });
    });

    // Parent expand/collapse
    document.querySelectorAll('.menu-parent').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.closest('.menu-parent-group');
        const children = group.querySelector('.menu-children');
        const chevron = btn.querySelector('.menu-chevron');
        children.classList.toggle('hidden');
        chevron.classList.toggle('rotate-180');
      });
    });

    // Profile dropdown
    const profileButton = document.getElementById('profileButton');
    const profileMenu = document.getElementById('profileMenu');
    profileButton.addEventListener('click', (e) => {
      e.stopPropagation();
      profileMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', () => profileMenu.classList.add('hidden'));
  </script>
